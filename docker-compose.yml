services:

  web:
    build:
      context: .
    container_name: django_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  celery:
    build:
      context: .
    container_name: django_celery
    command: celery -A celeryRedis worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis

  celery-beat:
    build:
      context: .
    container_name: django_celery_beat
    command: celery -A celeryRedis beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: django_redis
    ports:
      - "6379:6379"